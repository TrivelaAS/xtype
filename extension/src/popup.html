<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>XType Controller</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1419;
        --card: #16181c;
        --border: #2f3336;
        --text: #e7e9ea;
        --muted: #71767b;
        --accent: #1d9bf0;
        --green: #00ba7c;
        --red: #f4212e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 14px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--card);
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--red);
      }
      .dot.connected {
        background: var(--green);
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      .card-title {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--muted);
        margin-bottom: 8px;
        font-weight: 600;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 8px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      input[type="text"],
      input[type="number"] {
        width: 100%;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        color: var(--text);
        font-size: 12px;
      }
      input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }
      button {
        border: none;
        border-radius: 8px;
        padding: 7px 11px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        color: #fff;
        background: var(--accent);
        transition: opacity 0.15s ease;
      }
      button:hover {
        opacity: 0.9;
      }
      button.secondary {
        background: #272c30;
        color: var(--text);
        border: 1px solid var(--border);
      }
      button.danger {
        background: var(--red);
        width: 100%;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .muted {
        color: var(--muted);
        font-size: 12px;
      }
      .progress-track {
        width: 100%;
        height: 6px;
        background: #272c30;
        border-radius: 999px;
        overflow: hidden;
        margin: 6px 0 8px;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--green);
        transition: width 0.2s ease;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">XType</div>
      <div class="status-badge">
        <span id="connDot" class="dot"></span>
        <span id="connLabel">Disconnected</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Dedicated Background Window</div>
      <div class="row">
        <span class="muted">Bound target:</span>
        <strong id="windowStatus">Not bound</strong>
      </div>
      <div class="btn-grid">
        <button id="openWindowBtn">Open Unfocused X</button>
        <button id="bindWindowBtn" class="secondary">Bind This Window</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Active Job</div>
      <div id="jobSummary" class="muted">Idle — waiting for jobs</div>
      <div class="progress-track">
        <div id="jobProgress" class="progress-fill"></div>
      </div>
      <button id="stopBtn" class="danger" disabled>Emergency Stop</button>
    </div>

    <div class="card">
      <div class="card-title">Typing Profile & Bridge</div>
      <div class="row">
        <span class="muted" style="min-width: 72px;">Bridge URL</span>
        <input id="serverUrlInput" type="text" placeholder="http://127.0.0.1:4110" />
      </div>
      <div class="row">
        <span class="muted" style="min-width: 72px;">WPM (<span id="wpmVal">68</span>)</span>
        <input id="wpmSlider" type="range" min="30" max="130" value="68" />
      </div>
      <div class="row">
        <span class="muted" style="min-width: 72px;">Typo (<span id="typoVal">2.0</span>%)</span>
        <input id="typoSlider" type="range" min="0" max="10" step="0.5" value="2" />
      </div>
      <label class="checkbox-row">
        <input id="overrideCheck" type="checkbox" />
        <span>Override incoming API job WPM/typo with these sliders</span>
      </label>
    </div>

    <button id="testMockBtn" class="secondary" style="width: 100%;">
      Run Mock X.com Typing Test
    </button>

    <script src="popup.js" type="module"></script>
  </body>
</html>
